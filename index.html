    Object.assign(TEXT.zh,{prototype:"共享测试注册",accessIntro:"通过研究团队发送的同一个链接创建自己的私密测试账号。",waiting:"请打开研究团队发送的共享测试注册链接。",registerPrompt:"创建账号或登录。每个账号只能访问自己的匿名化记录。",registerTab:"创建账号",loginTab:"登录",usernameLabel:"用户名",passwordLabel:"密码",passwordHint:"可以使用任意字符。此 PoC 暂不提供密码找回服务。",accountConsent:"我了解此合成 PoC 测试会把我的匿名化记录存入研究者的 Personal OneDrive。",createAccount:"创建私密账号",loginButton:"登录",accountCreating:"正在创建私密账号……",loginWorking:"正在登录……",usernameTaken:"该用户名已被使用，请换一个。",accountFailed:"无法创建账号，请检查填写内容后重试。",loginFailed:"用户名或密码不正确。",manualTitle:"使用旧版邀请",greet:"{name} 的恢复支持"});
    Object.assign(TEXT.sv,{prototype:"Delad testregistrering",accessIntro:"Använd forskarteamets gemensamma länk för att skapa ett eget privat testkonto.",waiting:"Öppna den gemensamma testregistreringslänken från forskarteamet.",registerPrompt:"Skapa ett konto eller logga in. Varje konto ser endast sina egna pseudonymiserade uppgifter.",registerTab:"Skapa konto",loginTab:"Logga in",usernameLabel:"Användarnamn",passwordLabel:"Lösenord",passwordHint:"Alla tecken är tillåtna. Denna PoC har ingen tjänst för lösenordsåterställning.",accountConsent:"Jag förstår att mina pseudonymiserade uppgifter lagras i forskarens Personal OneDrive för detta syntetiska PoC-test.",createAccount:"Skapa privat konto",loginButton:"Logga in",accountCreating:"Skapar ditt privata konto…",loginWorking:"Loggar in…",usernameTaken:"Användarnamnet används redan. Välj ett annat.",accountFailed:"Kontot kunde inte skapas. Kontrollera fälten och försök igen.",loginFailed:"Användarnamnet eller lösenordet är fel.",manualTitle:"Använd en äldre inbjudan",greet:"Återhämtningsstöd för {name}"});
    const CONNECTION_KEY="cyclefuel.participant.connection.v1",REGISTRATION_KEY="cyclefuel.registration.v1",LANGUAGE_KEY="cyclefuel.language.v1";let language=localStorage.getItem(LANGUAGE_KEY)||"en",connection=null,registration=null,profile=null,records=[],page="today",lastSaved=false,authMode="register";const $=selector=>document.querySelector(selector),text=()=>TEXT[language]||TEXT.en;
    function safeEndpoint(value){try{const url=new URL(value);return url.protocol==="https:"?url.origin:null}catch{return null}}
    function importInvitation(){const params=new URLSearchParams(location.hash.slice(1)),api=safeEndpoint(params.get("api")||""),token=params.get("token")||"",join=params.get("join")||"";if(api&&token.length>=32)localStorage.setItem(CONNECTION_KEY,JSON.stringify({api,token}));if(api&&join.length>=32)localStorage.setItem(REGISTRATION_KEY,JSON.stringify({api,join}));if(location.hash)history.replaceState(null,"",location.pathname+location.search)}
    function readConnection(){try{const value=JSON.parse(localStorage.getItem(CONNECTION_KEY)||"null");return value&&safeEndpoint(value.api)&&typeof value.token==="string"?{api:safeEndpoint(value.api),token:value.token}:null}catch{return null}}
    function readRegistration(){try{const value=JSON.parse(localStorage.getItem(REGISTRATION_KEY)||"null");return value&&safeEndpoint(value.api)&&typeof value.join==="string"&&value.join.length>=32?{api:safeEndpoint(value.api),join:value.join}:null}catch{return null}}
    async function apiRequest(path,options={}){if(!connection)throw new Error("not_connected");const response=await fetch(connection.api+path,{...options,headers:{authorization:"Bearer "+connection.token,"content-type":"application/json",...(options.headers||{})}});if(!response.ok){const error=new Error("request_failed");error.status=response.status;throw error}return response.status===204?null:response.json()}
    async function publicRequest(path,payload){if(!registration)throw new Error("registration_required");const response=await fetch(registration.api+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.error||"request_failed");error.status=response.status;error.code=data.error;throw error}return data}
    function languageButtons(){return [["en","EN"],["zh","中文"],["sv","SV"]].map(([code,label])=>`<button type="button" class="${language===code?"on":""}" data-language="${code}">${label}</button>`).join("")}
    function bindLanguageButtons(){document.querySelectorAll("[data-language]").forEach(button=>button.addEventListener("click",()=>{language=button.dataset.language;localStorage.setItem(LANGUAGE_KEY,language);render()}))}
    function renderStaticText(){const t=text();document.documentElement.lang=language==="zh"?"zh-CN":language;document.querySelectorAll("[data-text]").forEach(element=>{element.textContent=t[element.dataset.text]||""});$("#access-languages").innerHTML=languageButtons();$("#app-languages").innerHTML=languageButtons();bindLanguageButtons()}
    function accessStatus(kind,message){const box=$("#access-status");box.className="status"+(kind==="error"?" error":"");box.replaceChildren();if(kind==="loading"){const spinner=document.createElement("span");spinner.className="spinner";spinner.setAttribute("aria-hidden","true");box.append(spinner)}const content=document.createElement("span");content.textContent=message;box.append(content)}
    function setAuthMode(mode){authMode=mode==="login"?"login":"register";$("#register-tab").classList.toggle("on",authMode==="register");$("#login-tab").classList.toggle("on",authMode==="login");$("#register-form").classList.toggle("hide",authMode!=="register");$("#login-form").classList.toggle("hide",authMode!=="login")}
    function showAccountAccess(){$("#account-access").classList.toggle("hide",!registration);if(registration)setAuthMode(authMode)}
    async function connect(){const t=text();connection=readConnection();registration=readRegistration();showAccountAccess();if(!connection){accessStatus("idle",registration?t.registerPrompt:t.waiting);return}accessStatus("loading",t.checking);try{profile=await apiRequest("/api/v1/me");if(profile.role!=="participant")throw new Error("participant_required");await loadRecords();$("#access").classList.add("hide");$("#app").classList.remove("hide");renderApp()}catch{localStorage.removeItem(CONNECTION_KEY);connection=null;profile=null;showAccountAccess();accessStatus(registration?"idle":"error",registration?t.registerPrompt:t.invalid)}}
    async function loadRecords(){const data=await apiRequest("/api/v1/checkins");records=Array.isArray(data.checkins)?data.checkins:[]}
    function render(){renderStaticText();registration=readRegistration();showAccountAccess();if(profile)renderApp();else accessStatus(connection?"loading":"idle",connection?text().checking:(registration?text().registerPrompt:text().waiting))}
    function renderApp(){const t=text(),pages=["today","checkin","patterns","learn"],name=profile.username||"";$("#navigation").innerHTML=t.nav.map((label,index)=>`<button type="button" class="${page===pages[index]?"on":""}" data-page="${pages[index]}">${label}</button>`).join("");document.querySelectorAll("[data-page]").forEach(button=>button.addEventListener("click",()=>{page=button.dataset.page;lastSaved=false;renderApp()}));$("#today-label").textContent=new Intl.DateTimeFormat(language==="zh"?"zh-CN":language==="sv"?"sv-SE":"en-GB",{day:"numeric",month:"long",year:"numeric"}).format(new Date()).toUpperCase();$("#page-title").textContent=page==="today"?t.greet.replace("{name}",name):t.nav[pages.indexOf(page)];$("#disconnect").textContent=(name.trim().charAt(0)||"P").toUpperCase();$("#banner").textContent=t.saved;$("#banner").classList.toggle("hide",!lastSaved);if(page==="today")renderToday();if(page==="checkin")renderCheckin();if(page==="patterns")renderPatterns();if(page==="learn")renderLearn()}
    function latest(){return records[0]||null}
    function renderToday(){const t=text(),recent=latest(),risk=Boolean(recent&&recent.safetyTriggered);$("#content").innerHTML=`<div class="grid"><section class="hero ${risk?"risk":""}"><span class="label">${t.focus}</span><h2>${recent?(risk?t.risk:t.done):t.hero}</h2><p>${recent?(risk?t.riskText:t.doneText):t.heroText}</p><div class="hero-actions"><button class="primary" id="start-checkin">${t.start} →</button><button class="secondary" id="refresh-records">${t.refresh}</button></div></section><section class="card ${risk?"risk":""}"><h3>${recent?(risk?t.risk:t.done):t.support}</h3><p>${recent?(risk?t.riskText:t.doneText):t.supportText}</p></section><section class="card"><h3>${t.trend}</h3>${chartMarkup()}<p>${t.patternsText}</p></section><section class="card"><h3>${t.help}</h3><p>${t.helpText}</p></section></div>`;$("#start-checkin").addEventListener("click",()=>{page="checkin";lastSaved=false;renderApp()});$("#refresh-records").addEventListener("click",refreshRecords)}
    function radioGroup(name,options){return `<div class="choice-grid">${options.map(([value,label],index)=>`<label><input type="radio" name="${name}" value="${value}" ${index===0?"required":""}><span>${label}</span></label>`).join("")}</div>`}
    function scaleGroup(name,question){const t=text();return `<div class="question"><h3>${question}</h3><div class="scale">${t.levels.map((label,index)=>`<label><input type="radio" name="${name}" value="${index+1}" ${index===0?"required":""}><span>${index+1}<small>${label}</small></span></label>`).join("")}</div></div>`}
    function renderCheckin(){const t=text();$("#content").innerHTML=`<section class="panel"><h2>${t.checkTitle}</h2><form id="checkin-form">${scaleGroup("energy",t.energy)}${scaleGroup("stress",t.stress)}<div class="question"><h3>${t.meals}</h3>${radioGroup("mealPattern",t.mealOptions)}</div><div class="question"><h3>${t.movement}</h3>${radioGroup("movement",t.movementOptions)}</div><div class="question"><h3>${t.focusQuestion}</h3>${radioGroup("supportFocus",t.focusOptions)}</div><label class="check risk-check"><input id="safety" name="safetyTriggered" type="checkbox"><span>${t.safe}</span></label><div id="safety-message" class="status error hide" role="alert">${t.riskText}</div><label class="check"><input name="consentAccepted" type="checkbox" required><span>${t.consent}</span></label><p id="form-error" class="error-text hide">${t.required}</p><div class="actions"><button class="primary" id="save-button" type="submit">${t.save}</button></div></form></section>`;$("#safety").addEventListener("change",event=>$("#safety-message").classList.toggle("hide",!event.target.checked));$("#checkin-form").addEventListener("submit",saveCheckin)}
    async function saveCheckin(event){event.preventDefault();const t=text(),form=event.currentTarget;if(!form.reportValidity()){$("#form-error").classList.remove("hide");return}$("#form-error").classList.add("hide");const button=$("#save-button");button.disabled=true;button.textContent=t.saving;const values=new FormData(form),payload={energy:Number(values.get("energy")),stress:Number(values.get("stress")),mealPattern:values.get("mealPattern"),movement:values.get("movement"),supportFocus:values.get("supportFocus"),safetyTriggered:values.get("safetyTriggered")==="on",consentAccepted:values.get("consentAccepted")==="on",consentVersion:"poc-0.3",locale:language};try{await apiRequest("/api/v1/checkins",{method:"POST",body:JSON.stringify(payload)});await loadRecords();page="today";lastSaved=true;renderApp()}catch{button.disabled=false;button.textContent=t.save;$("#form-error").textContent=t.saveFailed;$("#form-error").classList.remove("hide")}}
    function chartMarkup(){const t=text();if(!records.length)return `<p>${t.noRecords}</p>`;const rows=records.slice(0,7).reverse();return `<div class="chart" aria-label="${t.trend}">${rows.map(row=>`<div class="bar-pair"><i class="bar" style="height:${row.energy*20}%" title="${t.energyShort}: ${row.energy}"></i><i class="bar stress" style="height:${row.stress*20}%" title="${t.stressShort}: ${row.stress}"></i></div>`).join("")}</div><div class="legend"><span><i class="dot"></i>${t.energyShort}</span><span><i class="dot stress"></i>${t.stressShort}</span></div>`}
    function renderPatterns(){const t=text();$("#content").innerHTML=`<div class="notice"><h3>${t.patterns}</h3><p>${t.patternsText}</p></div><section class="card"><h3>${t.trend}</h3>${chartMarkup()}<div id="record-list" class="records"></div></section>`;const list=$("#record-list");records.forEach(row=>{const item=document.createElement("article");item.className="record"+(row.safetyTriggered?" risk":"");const left=document.createElement("div"),title=document.createElement("strong"),meta=document.createElement("p");title.textContent=`${t.energyShort} ${row.energy}/5 · ${t.stressShort} ${row.stress}/5`;meta.textContent=`${t.recorded}: ${new Intl.DateTimeFormat(language==="zh"?"zh-CN":language==="sv"?"sv-SE":"en-GB",{dateStyle:"medium",timeStyle:"short"}).format(new Date(row.recordedAt))}`;left.append(title,meta);item.append(left);list.append(item)})}
    function renderLearn(){const t=text();$("#content").innerHTML=`<div class="notice"><h3>${t.learn}</h3><p>${t.disclaimer}</p></div><div class="topics">${t.topics.map(([title,body])=>`<article class="card"><span class="label">REVIEWED</span><h3>${title}</h3><p>${body}</p></article>`).join("")}</div>`}
    async function refreshRecords(){try{await loadRecords();renderApp()}catch{$("#banner").textContent=text().connectionLost;$("#banner").classList.remove("hide")}}
    async function finishAuthentication(data){connection={api:registration.api,token:data.token};localStorage.setItem(CONNECTION_KEY,JSON.stringify(connection));profile=data;await loadRecords();$("#access").classList.add("hide");$("#app").classList.remove("hide");renderApp()}
    async function registerAccount(event){event.preventDefault();const t=text(),form=event.currentTarget;if(!form.reportValidity())return;const button=form.querySelector("button[type=submit]"),values=new FormData(form);button.disabled=true;button.textContent=t.accountCreating;accessStatus("loading",t.accountCreating);try{const data=await publicRequest("/api/v1/register",{registrationCode:registration.join,username:String(values.get("username")||""),password:String(values.get("password")||""),consentAccepted:values.get("consentAccepted")==="on",consentVersion:"poc-0.3",locale:language});form.reset();await finishAuthentication(data)}catch(error){button.disabled=false;button.textContent=t.createAccount;accessStatus("error",error.status===409?t.usernameTaken:t.accountFailed)}}
    async function loginAccount(event){event.preventDefault();const t=text(),form=event.currentTarget;if(!form.reportValidity())return;const button=form.querySelector("button[type=submit]"),values=new FormData(form);button.disabled=true;button.textContent=t.loginWorking;accessStatus("loading",t.loginWorking);try{const data=await publicRequest("/api/v1/login",{username:String(values.get("username")||""),password:String(values.get("password")||"")});form.reset();await finishAuthentication(data)}catch{button.disabled=false;button.textContent=t.loginButton;accessStatus("error",t.loginFailed)}}
    function disconnect(){localStorage.removeItem(CONNECTION_KEY);connection=null;profile=null;records=[];page="today";lastSaved=false;$("#app").classList.add("hide");$("#access").classList.remove("hide");render()}
    $("#register-tab").addEventListener("click",()=>setAuthMode("register"));$("#login-tab").addEventListener("click",()=>setAuthMode("login"));$("#register-form").addEventListener("submit",registerAccount);$("#login-form").addEventListener("submit",loginAccount);$("#manual-form").addEventListener("submit",event=>{event.preventDefault();const api=safeEndpoint($("#api-input").value),token=$("#token-input").value.trim();if(!api||token.length<32){accessStatus("error",text().invalid);return}localStorage.setItem(CONNECTION_KEY,JSON.stringify({api,token}));$("#token-input").value="";connect()});$("#disconnect").addEventListener("click",disconnect);
    importInvitation();registration=readRegistration();connection=readConnection();renderStaticText();connect();
  </script>
