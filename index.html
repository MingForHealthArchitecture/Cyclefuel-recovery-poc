const T={en:{welcome:"Welcome to CycleFuel",intro:"Daily, evidence-grounded support for FHA and RED-S recovery—without scores, predictions, or pressure.",prototype:"Prototype access",demo:"Choose a sign-in method to explore. No real account information is collected or transmitted.",privacy:"Educational prototype only—not a medical device or treatment service.",disclaimer:"Educational support only. Not a diagnostic or treatment tool.",nav:["Today","Check-in","My patterns","Learn"],greet:"Good morning, Maya",focus:"TODAY'S FOCUS",hero:"A small check-in can shape today's support",heroText:"Notice what is present today. There is no score to achieve and no perfect answer.",start:"Start check-in",support:"Your daily support will appear here",supportText:"It uses your check-in and reviewed evidence—never a recovery percentage.",trend:"Energy and stress",help:"Some symptoms should not wait for an app",helpText:"Severe pain, fainting, chest pain, very heavy bleeding, or urgent mental-health concerns need professional support.",q:["How is your energy today?","How much stress are you carrying?"],levels:["Very low","Low","Okay","Good","Very good"],safe:"Demo a safety trigger",save:"Save check-in",patterns:"Patterns, not predictions",patternsText:"These summaries do not indicate a recovery stage, ovulation, or time to menstruation.",learn:"Reviewed recovery education",topics:["Understanding FHA","Nourishment and recovery","Movement and rest","Stress and support"],done:"Protect some recovery space today",doneText:"Choose one small, realistic action that supports nourishment, rest, or connection.",risk:"Pause and seek medical support",riskText:"Seek professional assessment. If symptoms are severe or rapidly worsening, seek urgent care."},zh:{welcome:"欢迎使用 CycleFuel",intro:"为 FHA 和 RED-S 恢复提供每日循证支持——没有评分、预测或压力。",prototype:"原型访问",demo:"请选择一种登录方式体验原型。系统不会收集或传输真实账号信息。",privacy:"仅供教育用途，不是医疗器械或治疗服务。",disclaimer:"仅提供教育支持，不用于诊断或治疗。",nav:["今天","每日记录","我的趋势","了解更多"],greet:"早上好，Maya",focus:" function langs(){return ["en","zh","sv"].map((x,i)=>'<button class="'+(lang===x?"on":"")+'" onclick="setLang(\''+x+'\')">'+["EN","中文","SV"][i]+"</button>").join("")}function setLang(x){lang=x;render()}function login(){document.querySelector(".login").classList.add("hide");document.querySelector(".app").classList.remove("hide");render()}function chart(){return '<div class="chart">'+[35,43,50,45,58,62,59].map(x=>'<i class="bar" style="height:'+x+'%"></i>').join("")+"</div>"}

tion>";if(view===3)c.innerHTML='<div class="notice"><h3>'+t.learn+'</h3><p>'+t.disclaimer+'</p></div><div class="topics">'+t.topics.map(x=>'<article class="card"><span class="label">REVIEWED</span><h3>'+x+"</h3><p>"+t.supportText+"</p></article>").join("")+"</div>"}document.querySelector("#logout").onclick=()=>{document.querySelector(".app").classList.add("hide");document.querySelector(".login").classList.remove("hide");render()};render();
